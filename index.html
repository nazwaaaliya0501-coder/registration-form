<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <p class="eyebrow">WELCOME</p>
            <h1>Registration Form</h1>
            <p class="subtitle">Please fill in the form below to register.</p>
        </div>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <small class="error-message" id="fullNameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="text" id="email" placeholder="name@example.com">
                <small class="error-message" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters">
                <small class="error-message" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Enter your password again">
                <small class="error-message" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="At least 10 digits" inputmode="numeric">
                <small class="error-message" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="option-list">
                    <label class="choice">
                        <input type="radio" name="gender" value="Female"> Female
                    </label>
                    <label class="choice">
                        <input type="radio" name="gender" value="Male"> Male
                    </label>
                </div>
                <small class="error-message" id="genderError"></small>
            </div>

            <div class="form-group">
                <label>Hobbies / Interests</label>
                <div class="option-list">
                    <label class="choice">
                        <input type="checkbox" name="hobbies" value="Reading"> Reading
                    </label>
                    <label class="choice">
                        <input type="checkbox" name="hobbies" value="Music"> Music
                    </label>
                    <label class="choice">
                        <input type="checkbox" name="hobbies" value="Sports"> Sports
                    </label>
                    <label class="choice">
                        <input type="checkbox" name="hobbies" value="Traveling"> Traveling
                    </label>
                </div>
                <small class="error-message" id="hobbiesError"></small>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <select id="country">
                    <option value="">Select your country</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Malaysia">Malaysia</option>
                    <option value="Singapore">Singapore</option>
                    <option value="Thailand">Thailand</option>
                    <option value="Australia">Australia</option>
                    <option value="Japan">Japan</option>
                    <option value="South Korea">South Korea</option>
                    <option value="United States">United States</option>
                    <option value="United Kingdom">United Kingdom</option>
                </select>
                <small class="error-message" id="countryError"></small>
            </div>

            <button type="submit">Create Account</button>

            <p id="successMessage" class="success-message"></p>

        </form>
    </div>

</body>
</html>
